<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>육진대 | 아빠와 아이가 갈만한 곳</title>
<link rel="icon" type="image/svg+xml" href="assets/logo/character-logo.svg" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#1A2F6B" />
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
</head>
<body>
<!-- 스플래시를 덮는 핵심 스타일(전체화면 덮기)은 외부 폰트/CSS 로딩 속도와
     무관하게 항상 즉시 적용되도록 인라인으로도 박아둔다 — 느린 네트워크에서
     외부 CSS가 늦게 붙으면 그 사이 아래 헤더(작은 로고+검정 텍스트)가 잠깐
     비쳐 보이던 문제가 있었다. css/style.css의 .splash 규칙과 값을 맞춰둔다. -->
<div class="splash" id="splash" style="position:fixed;inset:0;z-index:2000;background:#F5F6FA;">
  <img class="splash__bg" src="assets/splash/splash-bg.jpg" alt="육진대" style="width:100%;height:100%;object-fit:cover;display:block;" />
</div>
<script>
  (function () {
    var splash = document.getElementById("splash");
    if (sessionStorage.getItem("splashShown")) {
      splash.style.display = "none";
      window.dispatchEvent(new Event("splashHidden"));
    } else {
      sessionStorage.setItem("splashShown", "1");
      setTimeout(function () {
        splash.classList.add("splash--hide");
        setTimeout(function () {
          splash.style.display = "none";
          window.dispatchEvent(new Event("splashHidden"));
        }, 400);
      }, 1500);
    }
  })();
</script>

<div class="app">

  <header class="header header--home">
    <a class="header__brand" href="index.html">
      <img class="header__logo" src="assets/logo/character-logo.svg" alt="육진대" />
      <span class="header__title">아빠, 어디가? <span class="header__subtitle">by 육진대</span></span>
    </a>
    <div class="header__actions">
      <button class="header__bell" type="button" aria-label="알림">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 10a6 6 0 0 1 12 0c0 4 1.5 5.5 2 6.2H4c.5-.7 2-2.2 2-6.2z"/>
          <path d="M10 19a2 2 0 0 0 4 0"/>
        </svg>
      </button>
      <button class="header__install" type="button" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12" /><path d="M7 10l5 5 5-5" /><path d="M5 19h14" /></svg>
        설치
      </button>
    </div>
    <div class="notices-panel" id="notices-panel"></div>
  </header>

  <div class="search">
    <input class="search__input" id="search-input" type="search" placeholder="지역, 장소를 검색해보세요" />
  </div>

  <section class="section" id="region-section">
    <h2 class="section__title">지역별 Top 10</h2>
    <div class="region-map-wrap">
      <div class="region-map" id="region-map">
        <!-- 대한민국 인터랙티브 지도(서울강북/서울강남/경기북부/인천·부천/경기남부/
             강원도/충청도/전라도/경상도/제주), REGION_MAP_PATHS 참고 -->
      </div>
      <div class="region-legend" id="region-legend"></div>
    </div>
    <p class="region-map__caption" id="region-map-caption">지도를 눌러 지역을 선택해보세요</p>
    <div class="curated-links" id="curated-links">
      <!-- 축제·행사 TOP10 / 테마 코스 모음, CURATED_LINKS 참고 -->
    </div>
  </section>

  <section class="banner is-loading" id="hero-banner">
    <div class="banner__track" id="hero-track">
      <div class="banner__slide">
        <img class="banner__logo" src="assets/logo/main-logo.svg" alt="육진대 - 육아에 진심인 대디" />
        <p class="banner__tagline">아빠들이 직접 다녀온, 아빠와 아이가 갈만한 곳</p>
      </div>
      <div class="banner__slide banner__slide--stat">
        <p class="banner__big">300+</p>
        <p class="banner__tagline">아빠 크리에이터가 함께 만드는 지도</p>
      </div>
      <div class="banner__slide banner__slide--stat">
        <p class="banner__big">99곳</p>
        <p class="banner__tagline">전국 방방곡곡, 직접 다녀온 곳만 소개해요</p>
      </div>
    </div>
    <div class="banner__dots" id="hero-dots"></div>
  </section>

  <div class="tag-filter" id="tag-filter">
    <!-- 자연/공원, 실내놀이, 맛집, 카페, 체험/문화, 스포츠, 무료 -->
  </div>

  <section class="section">
    <h2 class="section__title section__title--diary">추천장소</h2>
    <!-- 날씨를 못 가져오면 렌더 자체를 건너뛴다(hidden 유지). -->
    <div class="today-weather" id="today-weather" hidden></div>
    <div class="place-grid" id="place-list">
      <p class="place-list__loading" id="place-loading">불러오는 중...</p>
    </div>
    <button type="button" class="suggest-cta" id="suggest-btn">
      <span class="suggest-cta__icon">📍</span>
      <span class="suggest-cta__text">
        <strong>좋았던 곳이 여기 없나요?</strong>
        아빠가 직접 다녀온 곳을 추천해주세요
      </span>
    </button>
    <!-- 탭바에서 "육진대"를 빼면서 소개로 가는 길이 사라졌다. 자주 볼 화면은
         아니지만 없어지면 안 되니 목록 끝에 조용히 남겨 둔다. -->
    <div class="foot-links">
      <button type="button" class="about-link" id="tour-again">사용법 다시 보기</button>
      <a class="about-link" href="about.html">육진대는 어떤 팀인가요?</a>
    </div>
  </section>

  <nav class="tabbar">
    <a class="tabbar__item is-active" href="index.html"><span class="tabbar__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5L12 4l8 7.5"/><path d="M6 10.5V19a1 1 0 0 0 1 1h3v-5h4v5h3a1 1 0 0 0 1-1v-8.5"/></svg></span>홈</a>
    <a class="tabbar__item" href="map.html"><span class="tabbar__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.6 7-11.5A7 7 0 0 0 5 9.5C5 14.4 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/></svg></span>주변</a>
    <a class="tabbar__item" href="favorite.html"><span class="tabbar__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-9.5-9.3C1.2 8 2.7 4.8 6 4.2c2-.4 3.7.5 6 2.8 2.3-2.3 4-3.2 6-2.8 3.3.6 4.8 3.8 3.5 7-2 4.7-9.5 9.3-9.5 9.3z"/></svg></span>찜</a>
    <a class="tabbar__item" href="courses.html"><span class="tabbar__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h6a2 2 0 0 1 2 2v11a2 2 0 0 0-2-2H4z"/><path d="M20 6h-6a2 2 0 0 0-2 2v11a2 2 0 0 1 2-2h6z"/></svg></span>코스</a>
  </nav>

</div>

  <div class="report-modal-overlay" id="suggest-modal-overlay">
    <div class="report-modal" role="dialog" aria-modal="true" aria-label="장소 추천">
      <div class="report-modal__header">
        <p class="report-modal__title">장소 추천하기</p>
        <button type="button" class="report-modal__close" id="suggest-close" aria-label="닫기">✕</button>
      </div>
      <div class="report-modal__body">
        <label class="report-modal__label" for="suggest-name">어디인가요?</label>
        <input type="text" id="suggest-name" class="report-modal__value-input" placeholder="예: 서울숲 곤충식물원" maxlength="60" />

        <label class="report-modal__label" for="suggest-value">아이와 가기 어떤 점이 좋았나요?</label>
        <input type="text" id="suggest-value" class="report-modal__value-input" placeholder="예: 무료이고 유모차로 다니기 편해요" maxlength="200" />

        <p class="report-modal__label">기억나는 것만 골라주세요 <span class="suggest-amenity__hint">(지도에 없는 정보라 큰 도움이 돼요)</span></p>
        <div class="suggest-amenity" id="suggest-amenities">
          <div class="suggest-amenity__row" data-key="수유실">
            <span class="suggest-amenity__name">수유실</span>
            <div class="suggest-amenity__options">
              <button type="button" class="suggest-amenity__opt" data-value="있음">있음</button>
              <button type="button" class="suggest-amenity__opt" data-value="없음">없음</button>
            </div>
          </div>
          <div class="suggest-amenity__row" data-key="기저귀교환대">
            <span class="suggest-amenity__name">기저귀교환대</span>
            <div class="suggest-amenity__options">
              <button type="button" class="suggest-amenity__opt" data-value="있음">있음</button>
              <button type="button" class="suggest-amenity__opt" data-value="없음">없음</button>
            </div>
          </div>
          <div class="suggest-amenity__row" data-key="유아의자">
            <span class="suggest-amenity__name">유아의자</span>
            <div class="suggest-amenity__options">
              <button type="button" class="suggest-amenity__opt" data-value="있음">있음</button>
              <button type="button" class="suggest-amenity__opt" data-value="없음">없음</button>
            </div>
          </div>
          <div class="suggest-amenity__row" data-key="주차">
            <span class="suggest-amenity__name">주차</span>
            <div class="suggest-amenity__options">
              <button type="button" class="suggest-amenity__opt" data-value="무료">무료</button>
              <button type="button" class="suggest-amenity__opt" data-value="유료">유료</button>
              <button type="button" class="suggest-amenity__opt" data-value="없음">없음</button>
            </div>
          </div>
        </div>

        <div id="suggest-turnstile" class="report-modal__turnstile"></div>
        <p class="report-modal__error" id="suggest-error" hidden></p>
      </div>
      <p class="report-modal__success" id="suggest-success" hidden>추천해주셔서 고마워요! 확인 후 지도에 올릴게요.</p>
      <div class="report-modal__footer">
        <button type="button" class="btn-primary" id="suggest-submit" disabled>추천하기</button>
      </div>
    </div>
  </div>

<script src="js/util.js"></script>
<!-- 지도 좌표는 app.js에서 분리했다(51KB). 앱 로직만 고쳐도 이 파일은 캐시가 유지된다. -->
<script src="js/region-map-paths.js"></script>
<script src="js/favorites.js"></script>
<script src="js/app.js"></script>
<!-- 장소 추천의 사람 확인(Turnstile)에 사이트 키가 필요하다. 홈은 지도를 쓰지 않아
     그동안 이 설정을 안 불러왔다. -->
<script src="/naver-config"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script src="js/suggest.js"></script>
<script src="js/tour.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
