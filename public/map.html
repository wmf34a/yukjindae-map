<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>지도 | 육진대</title>
<link rel="icon" type="image/png" href="assets/logo/character-logo-96.png" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#1A2F6B" />
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/map.css" />
</head>
<body>
<div class="app app--map">

  <header class="header">
    <a class="header__brand" href="index.html">
      <img class="header__logo" src="assets/logo/character-logo-96.png" alt="육진대" />
      <span class="header__title">아빠, 어디가? <span class="header__subtitle">by 육진대</span></span>
    </a>
    <button class="header__install" type="button" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12" /><path d="M7 10l5 5 5-5" /><path d="M5 19h14" /></svg>
      설치
    </button>
  </header>

  <div class="map-toolbar">
    <div class="map-toolbar__regions" id="map-region-chips"></div>
  </div>

  <div class="map-nearby" id="map-nearby" hidden></div>

  <div id="map" class="map-canvas"></div>
  <p id="map-toast" class="map-toast"></p>
  <button id="track-btn" class="map-track-btn" title="내 위치 · 실시간 추적">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3v3M12 18v3M3 12h3M18 12h3" stroke-linecap="round"/>
      <circle cx="12" cy="12" r="6.5"/>
      <circle cx="12" cy="12" r="1.8" fill="currentColor" stroke="none"/>
    </svg>
  </button>
  <button id="nursing-layer-btn" class="map-layer-btn" title="공공 수유실 보기">🍼</button>
  <button id="toilet-layer-btn" class="map-layer-btn map-layer-btn--toilet" title="기저귀교환대 보기">🚼</button>
  <!-- 지도에 없는 수유실을 알려주는 자리. 🍼 를 켰을 때만 보인다 — 수유실을 보고
       있을 때라야 "여기 없네"라는 생각이 든다. -->
  <button id="nursing-add-btn" class="map-add-btn" hidden>🍼 여기 수유실이 있어요</button>

  <div class="map-sheet" id="map-sheet">
    <div class="map-sheet__handle"></div>
    <div id="map-sheet-content"></div>
  </div>

  <!-- 수유실 제보. 공공데이터에 없는 곳을 알려주거나, 있는 곳의 정보가 달라졌다고
       알려주는 두 가지 용도로 쓴다. -->
  <div class="report-modal-overlay" id="nursing-report-overlay">
    <div class="report-modal" role="dialog" aria-modal="true" aria-labelledby="nursing-report-title">
      <div class="report-modal__head">
        <p class="report-modal__title" id="nursing-report-title">수유실 알려주기</p>
        <button type="button" class="report-modal__close" id="nursing-report-close" aria-label="닫기">✕</button>
      </div>
      <div class="report-modal__body">
        <label class="report-modal__label" for="nursing-report-name">어디인가요?</label>
        <input type="text" id="nursing-report-name" class="report-modal__value-input"
               placeholder="예: 롯데마트 청량리점 3층" maxlength="80" />

        <label class="report-modal__label" for="nursing-report-value">알려주실 내용</label>
        <input type="text" id="nursing-report-value" class="report-modal__value-input"
               placeholder="예: 아빠도 들어갈 수 있어요 / 지금은 없어졌어요" maxlength="200" />

        <p class="report-modal__hint" id="nursing-report-hint"></p>
        <p class="report-modal__error" id="nursing-report-error" hidden></p>
        <p class="report-modal__success" id="nursing-report-success" hidden>알려주셔서 고마워요! 확인 후 반영할게요.</p>
      </div>
      <div class="report-modal__foot">
        <button type="button" class="btn-primary" id="nursing-report-submit" disabled>보내기</button>
      </div>
    </div>
  </div>

  <nav class="tabbar">
    <a class="tabbar__item" href="index.html"><span class="tabbar__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5L12 4l8 7.5"/><path d="M6 10.5V19a1 1 0 0 0 1 1h3v-5h4v5h3a1 1 0 0 0 1-1v-8.5"/></svg></span>홈</a>
    <a class="tabbar__item is-active" href="map.html"><span class="tabbar__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.6 7-11.5A7 7 0 0 0 5 9.5C5 14.4 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/></svg></span>주변</a>
    <a class="tabbar__item" href="favorite.html"><span class="tabbar__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-9.5-9.3C1.2 8 2.7 4.8 6 4.2c2-.4 3.7.5 6 2.8 2.3-2.3 4-3.2 6-2.8 3.3.6 4.8 3.8 3.5 7-2 4.7-9.5 9.3-9.5 9.3z"/></svg></span>찜</a>
    <a class="tabbar__item" href="courses.html"><span class="tabbar__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h6a2 2 0 0 1 2 2v11a2 2 0 0 0-2-2H4z"/><path d="M20 6h-6a2 2 0 0 0-2 2v11a2 2 0 0 1 2-2h6z"/></svg></span>코스</a>
  </nav>

</div>

<script src="/naver-config"></script>
<script>
  document.write('<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + window.__ENV__.NAVER_MAP_CLIENT_ID + '"><\/script>');
</script>
<script src="js/util.js"></script>
<script src="js/favorites.js"></script>
<!-- 네이버 지도 공식 마커 클러스터링(navermaps/marker-tools.js). CSP가 외부 CDN
     스크립트를 막고 있어 저장소에 직접 포함해서 같은 출처로 로드한다. -->
<script src="js/vendor/MarkerClustering.js"></script>
<script src="js/map.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
