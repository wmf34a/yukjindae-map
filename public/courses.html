<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>테마 코스 모음 | 육진대</title>
<link rel="icon" type="image/svg+xml" href="assets/logo/character-logo.svg" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#1A2F6B" />
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/place.css" />
</head>
<body>
<div class="app">

  <header class="header">
    <a href="javascript:history.back()" class="header__back" aria-label="뒤로가기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5"/>
        <path d="M11 18l-6-6 6-6"/>
      </svg>
    </a>
    <span class="header__title">테마 코스 모음</span>
  </header>

  <section class="section">
    <div class="course-list" id="course-list">
      <p class="place-list__loading">불러오는 중...</p>
    </div>
  </section>

  <div class="course-modal-overlay" id="course-modal-overlay">
    <div class="course-modal" role="dialog" aria-modal="true" aria-label="코스 경로">
      <div class="course-modal__header">
        <p class="course-modal__title" id="course-modal-title">코스 경로</p>
        <button type="button" class="course-modal__close" aria-label="닫기">✕</button>
      </div>
      <div class="course-modal__body" id="course-map-body">
        <p class="course-modal__loading">코스를 준비하는 중...</p>
      </div>
      <div class="course-modal__footer">
        <div class="course-order" id="course-order"></div>
        <p class="course-meta" id="course-meta"></p>
        <div class="course-segments" id="course-segments"></div>
        <a class="course-directions-btn" id="course-directions-btn" target="_blank" rel="noopener" hidden>네이버 지도로 길찾기</a>
      </div>
    </div>
  </div>

  <nav class="tabbar">
    <a class="tabbar__item" href="index.html"><span class="tabbar__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5L12 4l8 7.5"/><path d="M6 10.5V19a1 1 0 0 0 1 1h3v-5h4v5h3a1 1 0 0 0 1-1v-8.5"/></svg></span>홈</a>
    <a class="tabbar__item" href="map.html"><span class="tabbar__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.6 7-11.5A7 7 0 0 0 5 9.5C5 14.4 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/></svg></span>주변</a>
    <a class="tabbar__item" href="favorite.html"><span class="tabbar__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-9.5-9.3C1.2 8 2.7 4.8 6 4.2c2-.4 3.7.5 6 2.8 2.3-2.3 4-3.2 6-2.8 3.3.6 4.8 3.8 3.5 7-2 4.7-9.5 9.3-9.5 9.3z"/></svg></span>찜</a>
    <a class="tabbar__item" href="about.html"><img class="tabbar__icon tabbar__icon--img" src="assets/logo/character-logo.svg" alt="" />육진대</a>
  </nav>

</div>

<script src="/naver-config"></script>
<script>
  document.write('<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + window.__ENV__.NAVER_MAP_CLIENT_ID + '"><\/script>');
</script>
<script src="js/util.js"></script>
<script src="js/course.js"></script>
<script src="js/courses.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
