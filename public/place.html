<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>장소 상세 | 육진대</title>
<link rel="icon" type="image/png" href="assets/logo/character-logo-96.png" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#1A2F6B" />
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/place.css" />
</head>
<body>
<div class="app">

  <header class="header">
    <a href="javascript:history.back()" class="header__back" aria-label="뒤로가기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5"/>
        <path d="M11 18l-6-6 6-6"/>
      </svg>
    </a>
    <span class="header__title">장소 상세</span>
    <button class="header__install" type="button" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12" /><path d="M7 10l5 5 5-5" /><path d="M5 19h14" /></svg>
      설치
    </button>
  </header>

  <div id="place-detail">
    <p class="place-list__loading">불러오는 중...</p>
  </div>

  <div class="course-modal-overlay" id="course-modal-overlay">
    <div class="course-modal" role="dialog" aria-modal="true" aria-label="추천 코스">
      <div class="course-modal__header">
        <p class="course-modal__title">추천 코스</p>
        <button type="button" class="course-modal__close" aria-label="닫기">✕</button>
      </div>
      <div class="course-modal__body" id="course-map-body">
        <p class="course-modal__loading">코스를 준비하는 중...</p>
      </div>
      <div class="course-modal__footer">
        <div class="course-order" id="course-order"></div>
        <p class="course-meta" id="course-meta"></p>
        <div class="course-segments" id="course-segments"></div>
        <a class="course-directions-btn" id="course-directions-btn" target="_blank" rel="noopener" hidden>네이버 지도로 길찾기</a>
      </div>
    </div>
  </div>

  <div class="report-modal-overlay" id="report-modal-overlay">
    <div class="report-modal" role="dialog" aria-modal="true" aria-label="정보 제보">
      <div class="report-modal__header">
        <p class="report-modal__title">정보 제보하기</p>
        <button type="button" class="report-modal__close" aria-label="닫기">✕</button>
      </div>
      <div class="report-modal__body">
        <label class="report-modal__label" for="report-field">어떤 정보인가요?</label>
        <select class="report-modal__field" id="report-field">
          <option value="운영시간">운영시간</option>
          <option value="입장료">입장료</option>
          <option value="무료입장연령">무료입장 연령</option>
          <option value="주차상세">주차</option>
          <option value="기저귀교환대">기저귀교환대</option>
          <option value="수유실">수유실</option>
          <option value="유아의자">유아의자</option>
          <option value="근처맛집">근처 맛집</option>
          <option value="근처카페">근처 카페</option>
        </select>

        <div id="report-value-boolean" class="report-modal__value-group">
          <button type="button" class="report-modal__value-btn" data-value="있음">있어요</button>
          <button type="button" class="report-modal__value-btn" data-value="없음">없어요</button>
        </div>
        <!-- 근처맛집·근처카페처럼 여러 가게를 이어 적는 칸에만 보인다.
             지금 적혀 있는 가게를 보여주고, 더할지 갈아 끼울지 고르게 한다. -->
        <div id="report-list-mode" class="report-modal__list" hidden>
          <p class="report-modal__list-current">
            지금 적혀 있어요 — <span id="report-list-current-text"></span>
          </p>
          <div class="report-modal__list-modes" role="radiogroup" aria-label="반영 방식">
            <button type="button" class="report-modal__mode-btn is-selected" data-mode="추가">여기에 더하기</button>
            <button type="button" class="report-modal__mode-btn" data-mode="교체">전부 바꾸기</button>
          </div>
        </div>
        <input type="text" id="report-value-text" class="report-modal__value-input" placeholder="예: 36개월 미만 무료" hidden maxlength="200" />

        <div id="report-turnstile" class="report-modal__turnstile"></div>
        <p class="report-modal__error" id="report-error" hidden></p>
      </div>
      <p class="report-modal__success" id="report-success" hidden>제보해주셔서 감사합니다! 확인 후 반영할게요.</p>
      <div class="report-modal__footer">
        <button type="button" class="btn-primary" id="report-submit-btn" disabled>제보하기</button>
      </div>
    </div>
  </div>

  <nav class="tabbar">
    <a class="tabbar__item" href="index.html"><span class="tabbar__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5L12 4l8 7.5"/><path d="M6 10.5V19a1 1 0 0 0 1 1h3v-5h4v5h3a1 1 0 0 0 1-1v-8.5"/></svg></span>홈</a>
    <a class="tabbar__item" href="map.html"><span class="tabbar__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.6 7-11.5A7 7 0 0 0 5 9.5C5 14.4 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/></svg></span>주변</a>
    <a class="tabbar__item" href="favorite.html"><span class="tabbar__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-9.5-9.3C1.2 8 2.7 4.8 6 4.2c2-.4 3.7.5 6 2.8 2.3-2.3 4-3.2 6-2.8 3.3.6 4.8 3.8 3.5 7-2 4.7-9.5 9.3-9.5 9.3z"/></svg></span>찜</a>
    <a class="tabbar__item" href="courses.html"><span class="tabbar__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h6a2 2 0 0 1 2 2v11a2 2 0 0 0-2-2H4z"/><path d="M20 6h-6a2 2 0 0 0-2 2v11a2 2 0 0 1 2-2h6z"/></svg></span>코스</a>
  </nav>

</div>

<script src="/naver-config"></script>
<script>
  document.write('<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + window.__ENV__.NAVER_MAP_CLIENT_ID + '"><\/script>');
</script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script src="js/util.js"></script>
<script src="js/favorites.js"></script>
<script src="js/place.js"></script>
<script src="js/report.js"></script>
<script src="js/course.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
