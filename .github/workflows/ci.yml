name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci 대신 install — @apps-in-toss/devtools가 플랫폼별 optional 의존성
      # (@emnapi/*)을 끌어와서 lock 파일이 OS에 종속된다. macOS에서 만든 lock을
      # 리눅스 러너의 npm ci가 "lock과 package.json 불일치"로 거부한다.
      - run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci 대신 install — @apps-in-toss/devtools가 플랫폼별 optional 의존성
      # (@emnapi/*)을 끌어와서 lock 파일이 OS에 종속된다. macOS에서 만든 lock을
      # 리눅스 러너의 npm ci가 "lock과 package.json 불일치"로 거부한다.
      - run: npm install --no-audit --no-fund

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
