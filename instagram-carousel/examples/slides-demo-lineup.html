<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>인포그래픽 슬라이드 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="../carousel.css" />
<style>
  /* 축제 데이터(공연 라인업·프로그램)를 표처럼 정리하는 인포그래픽 슬라이드.
     사진 없이도 정보만으로 한 장이 완성된다. */
  .info { flex: 1; display: flex; flex-direction: column; gap: 22px; padding: 34px 68px 92px; }
  .days { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .day {
    background: #fff; border-radius: 26px; padding: 26px 26px 22px;
    box-shadow: 0 12px 30px rgba(44,53,85,.08);
  }
  .day__head {
    display: flex; align-items: center; gap: 10px; margin-bottom: 18px;
    font-size: 30px; font-weight: 800; color: var(--navy); letter-spacing: -.03em;
  }
  .day__head span {
    font-size: 22px; font-weight: 700; color: #fff; background: var(--primary);
    padding: 5px 14px; border-radius: 999px;
  }
  .day--sun .day__head { color: #B4552E; }
  .day--sun .day__head span { background: #D9743F; }
  .act { display: flex; align-items: center; gap: 14px; padding: 11px 0; border-top: 1px solid var(--line, #E7E9F2); }
  .act:first-of-type { border-top: none; }
  .act__ic { flex: none; width: 42px; text-align: center; font-size: 28px; }
  .act__txt { font-size: 26px; font-weight: 600; color: var(--text); letter-spacing: -.02em; line-height: 1.3; }
  .act__txt small { display: block; font-size: 21px; font-weight: 500; color: var(--sub); margin-top: 3px; }

  .always { background: #fff; border-radius: 26px; padding: 26px 30px; box-shadow: 0 12px 30px rgba(44,53,85,.08); }
  .always__title { font-size: 25px; font-weight: 800; color: var(--primary); margin-bottom: 16px; letter-spacing: -.02em; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip {
    font-size: 25px; font-weight: 700; color: var(--text); letter-spacing: -.02em;
    background: #EEF1F9; border-radius: 999px; padding: 11px 20px;
  }
  .chip--pop { background: var(--pop); color: var(--navy); }

  .band {
    display: flex; align-items: center; justify-content: center; gap: 16px;
    background: var(--navy); border-radius: 22px; padding: 22px 26px;
    color: #fff; font-size: 27px; font-weight: 700; letter-spacing: -.02em;
  }
  .band b { color: var(--pop); }
</style>
</head>
<body>

<section class="slide" id="d1">
  <div class="head head--tight">
    <h2>달성 YES! 키즈존<br /><b>이틀 공연 라인업</b></h2>
  </div>
  <div class="info">
    <div class="days">
      <div class="day">
        <p class="day__head">9월 5일 <span>토</span></p>
        <div class="act"><span class="act__ic">🎪</span><span class="act__txt">폴로세움<small>크레용용</small></span></div>
        <div class="act"><span class="act__ic">🫧</span><span class="act__txt">마술 버블쇼<small>마술사 박주홍</small></span></div>
        <div class="act"><span class="act__ic">🧪</span><span class="act__txt">싸이언스 매직스<small>마술사 문석호</small></span></div>
        <div class="act"><span class="act__ic">🤹</span><span class="act__txt">코미디서커스<small>팀 퍼니스트</small></span></div>
        <div class="act"><span class="act__ic">🎩</span><span class="act__txt">특별공연<small>마술사 나키</small></span></div>
      </div>
      <div class="day day--sun">
        <p class="day__head">9월 6일 <span>일</span></p>
        <div class="act"><span class="act__ic">🫧</span><span class="act__txt">계면활성제 아저씨 버블쇼</span></div>
        <div class="act"><span class="act__ic">🎈</span><span class="act__txt">빅벌룬쇼</span></div>
        <div class="act"><span class="act__ic">🧪</span><span class="act__txt">싸이언스 매직스<small>마술사 문석호</small></span></div>
        <div class="act"><span class="act__ic">🤹</span><span class="act__txt">코미디서커스<small>팀 퍼니스트</small></span></div>
        <div class="act"><span class="act__ic">🎁</span><span class="act__txt">특별공연<small>인싸가족</small></span></div>
      </div>
    </div>

    <div class="always">
      <p class="always__title">공연 말고도 하루 종일</p>
      <div class="chips">
        <span class="chip">에어바운스</span>
        <span class="chip">롤리팝</span>
        <span class="chip">아이도서관</span>
        <span class="chip chip--pop">AR 물놀이</span>
        <span class="chip">DIY 체험</span>
        <span class="chip">동물축제 사진전</span>
        <span class="chip">푸드트럭</span>
      </div>
    </div>

    <div class="band">국립대구과학관 일원 · 12:30~16:30 · <b>입장 무료</b></div>
  </div>
  <p class="credit" style="position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:19px;color:#A6AEC8;">
    프로그램은 주최 측 공지 기준 · 일부 프로그램 유료
  </p>
</section>

</body>
</html>
